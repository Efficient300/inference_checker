logLevel: warn

api: yes
apiAddress: :9997

rtsp: yes
rtspAddress: :8554
# только TCP: без потерь пакетов UDP на сотнях потоков 1080p
rtspTransports: [tcp]
# запас буфера для медленного читателя (иначе сервер рвёт соединение при кратком отставании)
writeQueueSize: 8192

rtmp: no
hls: no
webrtc: no
srt: no

paths:
  all_others:
